[project]
name = "awesome-olitreadwell"
version = "0.1.0"
description = "A curated list of the things Oli Treadwell likes, checked by the awesome-list engine."
requires-python = ">=3.12"
dependencies = [
    "awesome-list @ git+https://github.com/olitreadwell/awesome-list-template@20ba4fc",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
