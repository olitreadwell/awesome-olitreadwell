name: CI

# Validates the list structure and checks links on every pull request and
# push to the default branch.

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate list and check links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LYCHEE_VERSION: "v0.24.2"
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate list structure
        run: python3 scripts/validate_readme.py

      - name: Install lychee
        run: |
          set -euo pipefail
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o lychee.tar.gz
          tar -xzf lychee.tar.gz
          lychee_bin="$(find . -maxdepth 2 -type f -name lychee | head -n 1)"
          sudo mv "$lychee_bin" /usr/local/bin/lychee
          lychee --version

      - name: Check links
        run: |
          lychee \
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429,999 \
            --no-progress \
            --exclude '^https?://(localhost|127\.0\.0\.1)' \
            readme.md civic-tech.md
